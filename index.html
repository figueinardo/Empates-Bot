
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT EMPATES VERANO</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --green: #00ff88;
    --red: #ff3355;
    --blue: #00aaff;
    --yellow: #ffcc00;
    --text: #e0e0f0;
    --muted: #666680;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 48px; animation: fadeDown 0.6s ease; }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: 0.1em; background: linear-gradient(135deg, var(--green), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
  header p { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.2em; margin-top: 8px; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; margin-bottom: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
  .tab { flex: 1; padding: 10px; text-align: center; font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-radius: 5px; transition: all 0.2s; border: none; background: none; }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .tab.active { background: rgba(0,255,136,0.1); color: var(--green); border: 1px solid rgba(0,255,136,0.2); }
  .section { display: none; }
  .section.active { display: block; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px 16px; text-align: center; position: relative; overflow: hidden; transition: border-color 0.2s; }
  .stat-card:hover { border-color: var(--green); }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--green), var(--blue)); opacity: 0.6; }
  .stat-label { font-size: 0.65rem; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.05em; line-height: 1; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.yellow { color: var(--yellow); }
  .stat-value.neutral { color: var(--text); }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  @media (max-width: 640px) { .charts { grid-template-columns: 1fr; } }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .chart-title { font-size: 0.7rem; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.1em; color: var(--text); margin-bottom: 16px; }
  .section-title span { color: var(--muted); font-size: 1rem; font-family: 'Space Mono', monospace; }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: auto; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { padding: 12px 14px; text-align: left; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.62rem; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  td { padding: 11px 14px; white-space: nowrap; }
  .result-w { color: var(--green); font-weight: 700; background: rgba(0,255,136,0.08); padding: 2px 8px; border-radius: 3px; }
  .result-l { color: var(--red); font-weight: 700; background: rgba(255,51,85,0.08); padding: 2px 8px; border-radius: 3px; }
  .result-v { color: var(--muted); font-weight: 700; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 3px; }
  .result-pending { color: var(--yellow); background: rgba(255,204,0,0.08); padding: 2px 8px; border-radius: 3px; font-size: 0.6rem; }
  .profit-pos { color: var(--green); }
  .profit-neg { color: var(--red); }
  .bar-wrap { background: rgba(255,255,255,0.05); border-radius: 3px; height: 6px; overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-green { background: var(--green); }
  .bar-red { background: var(--red); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.8rem; }
  .loading { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.2em; animation: pulse 1.5s ease infinite; }
  .updated { text-align: center; color: var(--muted); font-size: 0.6rem; letter-spacing: 0.15em; margin-top: 32px; text-transform: uppercase; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>BOT EMPATES VERANO</h1>
    <p>Dashboard de resultados · Pinnacle Reference</p>
  </header>
  <div id="app"><div class="loading">CARGANDO PICKS...</div></div>
</div>
<script>
async function loadPicks() {
  try {
    const r = await fetch('picks.json?nocache=' + Date.now());
    if (!r.ok) throw new Error('No picks');
    return await r.json();
  } catch (e) { return []; }
}

function calcStats(picks) {
  const res = picks.filter(p => p.profit !== null && p.profit !== undefined);
  const pend = picks.filter(p => p.profit === null || p.profit === undefined);
  const wins = res.filter(p => p.profit > 0).length;
  const losses = res.filter(p => p.profit < 0).length;
  const profit = res.reduce((s, p) => s + p.profit, 0);
  const yield_pct = res.length ? (profit / res.length) * 100 : 0;
  let racha = 0;
  for (let i = res.length - 1; i >= 0; i--) { if (res[i].profit > 0) racha++; else break; }
  let acum = 0;
  const cumProfit = res.map(p => { acum += p.profit; return Math.round(acum * 100) / 100; });
  const yieldArr = res.map((_, i) => Math.round((cumProfit[i] / (i + 1)) * 10000) / 100);
  return { res, pend, wins, losses, profit: Math.round(profit * 100) / 100, yield_pct, racha, cumProfit, yieldArr };
}

function calcByGroup(picks, keyFn) {
  const map = {};
  picks.forEach(p => {
    if (p.profit === null || p.profit === undefined) return;
    const k = keyFn(p);
    if (!map[k]) map[k] = { picks: 0, wins: 0, losses: 0, profit: 0 };
    map[k].picks++;
    if (p.profit > 0) map[k].wins++;
    else if (p.profit < 0) map[k].losses++;
    map[k].profit += p.profit;
  });
  return Object.entries(map).map(([key, d]) => ({
    key, ...d,
    profit: Math.round(d.profit * 100) / 100,
    yield: Math.round((d.profit / d.picks) * 10000) / 100
  }));
}

function mesLabel(mes) {
  const [y, m] = mes.split('-');
  const n = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${n[parseInt(m)-1]} ${y}`;
}

function pText(v) {
  const c = v > 0 ? 'profit-pos' : v < 0 ? 'profit-neg' : '';
  return `<span class="${c}">${v > 0 ? '+' : ''}${v.toFixed(2)}u</span>`;
}
function yText(v) {
  const c = v > 0 ? 'profit-pos' : v < 0 ? 'profit-neg' : '';
  return `<span class="${c}">${v > 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
}
function resultTag(p) {
  if (p.resultado === 'W') return '<span class="result-w">W</span>';
  if (p.resultado === 'L') return '<span class="result-l">L</span>';
  if (p.resultado === 'V') return '<span class="result-v">V</span>';
  return '<span class="result-pending">PENDIENTE</span>';
}
function profitCell(p) {
  if (p.profit === null || p.profit === undefined) return '<span style="color:var(--muted)">—</span>';
  return pText(p.profit);
}

function groupTable(data) {
  if (!data.length) return '<div class="empty">SIN DATOS</div>';
  return `<table>
    <thead><tr><th>Grupo</th><th>Picks</th><th>W</th><th>L</th><th>% Win</th><th>Profit</th><th>Yield</th></tr></thead>
    <tbody>${data.map(d => {
      const wp = d.picks ? Math.round((d.wins / d.picks) * 100) : 0;
      return `<tr>
        <td style="color:var(--yellow);font-weight:700">${d.key}</td>
        <td>${d.picks}</td>
        <td style="color:var(--green)">${d.wins}</td>
        <td style="color:var(--red)">${d.losses}</td>
        <td><div>${wp}%</div><div class="bar-wrap"><div class="bar-fill ${d.profit >= 0 ? 'bar-green' : 'bar-red'}" style="width:${wp}%"></div></div></td>
        <td>${pText(d.profit)}</td>
        <td>${yText(d.yield)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function barChart(id, labels, values) {
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    new Chart(el, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: values.map(v => v >= 0 ? 'rgba(0,255,136,0.6)' : 'rgba(255,51,85,0.6)'),
          borderColor: values.map(v => v >= 0 ? '#00ff88' : '#ff3355'),
          borderWidth: 1, borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#666680', font: { family: 'Space Mono', size: 10 }, maxRotation: 45 }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { ticks: { color: '#666680', font: { family: 'Space Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }, 50);
}

function render(picks) {
  const s = calcStats(picks);
  const byMonth = calcByGroup(picks, p => p.fecha.slice(0, 7)).sort((a, b) => a.key.localeCompare(b.key));
  const byLiga = calcByGroup(picks, p => p.liga).sort((a, b) => b.picks - a.picks);
  const pc = s.profit >= 0 ? 'green' : 'red';
  const yc = s.yield_pct >= 0 ? 'green' : 'red';

  document.getElementById('app').innerHTML = `
    <div class="tabs">
      <button class="tab active" onclick="showTab('general')">📊 General</button>
      <button class="tab" onclick="showTab('meses')">📅 Meses</button>
      <button class="tab" onclick="showTab('ligas')">🌍 Ligas</button>
      <button class="tab" onclick="showTab('historial')">📋 Historial</button>
    </div>

    <div class="section active" id="tab-general">
      <div class="stats">
        <div class="stat-card"><div class="stat-label">Total Picks</div><div class="stat-value neutral">${picks.length}</div></div>
        <div class="stat-card"><div class="stat-label">Wins</div><div class="stat-value green">${s.wins}</div></div>
        <div class="stat-card"><div class="stat-label">Losses</div><div class="stat-value red">${s.losses}</div></div>
        <div class="stat-card"><div class="stat-label">Profit</div><div class="stat-value ${pc}">${s.profit >= 0 ? '+' : ''}${s.profit.toFixed(2)}u</div></div>
        <div class="stat-card"><div class="stat-label">Yield</div><div class="stat-value ${yc}">${s.yield_pct >= 0 ? '+' : ''}${s.yield_pct.toFixed(1)}%</div></div>
        <div class="stat-card"><div class="stat-label">Racha</div><div class="stat-value yellow">${s.racha}🔥</div></div>
      </div>
      <div class="charts">
        <div class="chart-card"><div class="chart-title">📈 Profit Acumulado</div><canvas id="chartProfit" height="180"></canvas></div>
        <div class="chart-card"><div class="chart-title">📊 Yield %</div><canvas id="chartYield" height="180"></canvas></div>
      </div>
    </div>

    <div class="section" id="tab-meses">
      <div class="section-title">Por Mes <span>${byMonth.length} meses</span></div>
      <div class="table-wrap">${groupTable(byMonth.map(m => ({...m, key: mesLabel(m.key)})))}</div>
      <div class="chart-card"><div class="chart-title">📅 Profit por Mes</div><canvas id="chartMes" height="120"></canvas></div>
    </div>

    <div class="section" id="tab-ligas">
      <div class="section-title">Por Liga <span>${byLiga.length} ligas</span></div>
      <div class="table-wrap">${groupTable(byLiga)}</div>
      <div class="chart-card"><div class="chart-title">🌍 Profit por Liga</div><canvas id="chartLiga" height="120"></canvas></div>
    </div>

    <div class="section" id="tab-historial">
      <div class="section-title">Historial <span>${s.pend.length} pendientes</span></div>
      <div class="table-wrap">
        ${picks.length === 0 ? '<div class="empty">NO HAY PICKS</div>' : `
        <table>
          <thead><tr><th>#</th><th>Fecha</th><th>Liga</th><th>Partido</th><th>Cuota X</th><th>Resultado</th><th>Profit</th></tr></thead>
          <tbody>${[...picks].reverse().map(p => `
            <tr>
              <td style="color:var(--muted)">${p.id}</td>
              <td style="color:var(--muted)">${p.fecha}</td>
              <td>${p.liga}</td>
              <td>${p.home} vs ${p.away}</td>
              <td style="color:var(--yellow)">${p.cuota.toFixed(2)}</td>
              <td>${resultTag(p)}</td>
              <td>${profitCell(p)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`}
      </div>
    </div>

    <div class="updated">Actualizado · ${new Date().toLocaleString('es-ES')}</div>
  `;

  // General charts
  if (s.res.length > 0) {
    const labels = s.res.map((_, i) => i + 1);
    const opts = { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#666680', font: { family: 'Space Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } }, y: { ticks: { color: '#666680', font: { family: 'Space Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } } } };
    new Chart(document.getElementById('chartProfit'), { type: 'line', data: { labels, datasets: [{ data: s.cumProfit, borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,0.08)', fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#00ff88' }] }, options: opts });
    new Chart(document.getElementById('chartYield'), { type: 'line', data: { labels, datasets: [{ data: s.yieldArr, borderColor: '#00aaff', backgroundColor: 'rgba(0,170,255,0.08)', fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#00aaff' }] }, options: opts });
  }

  // Month chart
  barChart('chartMes', byMonth.map(m => mesLabel(m.key)), byMonth.map(m => m.profit));

  // Liga chart
  barChart('chartLiga', byLiga.map(l => l.key.replace(/[^\w\s]/gu, '').trim()), byLiga.map(l => l.profit));
}

function showTab(name) {
  const tabs = ['general', 'meses', 'ligas', 'historial'];
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', tabs[i] === name));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

loadPicks().then(render);
</script>
</body>
</html>
